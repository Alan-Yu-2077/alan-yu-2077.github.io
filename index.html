<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Alan Yu — Software Engineer / AI Agent Engineer. A résumé you scroll through: a 3D tour of my desk." />
    <title>Alan Yu · Software Engineer / AI Agent Engineer · Résumé</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alan Yu · Software Engineer / AI Agent Engineer" />
    <meta property="og:description" content="A résumé you scroll through: a 3D tour of my desk." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="./assets/index-B0muNddA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-wSMKAIsj.css">
  </head>
  <body>
    <!-- 3D 舞台：固定在内容后面 -->
    <canvas id="stage" aria-hidden="true"></canvas>

    <!-- 顶部栏：名字 + 章节导航 + Quick résumé -->
    <header id="topbar"></header>
    <div id="progress" aria-hidden="true"><i></i></div>

    <!-- 开场片头字幕：远景期间显示姓名和职位（内容由 dom.js 填充；正文里有同样的信息，所以对读屏隐藏） -->
    <div id="opening" aria-hidden="true"></div>

    <!-- 滚动叙事内容（由 src/ui/dom.js 根据 content.js 生成） -->
    <main id="story"></main>

    <!-- Quick résumé：传统一页式排版，可打印 -->
    <div id="sheet" role="dialog" aria-modal="true" aria-label="Quick résumé" hidden></div>

    <div id="hint" aria-hidden="true">Psst — click, drag or type: the desk plays along ↗</div>
    <div id="tip" aria-hidden="true"></div>

    <!-- 彩蛋揭晓：全屏大字（内容由 ui.js 根据 content.js 填充） -->
    <div id="egg" role="status" aria-live="polite" hidden></div>

    <noscript>
      <p style="padding: 24px; font-family: sans-serif">This page needs JavaScript to display the résumé.</p>
    </noscript>
  </body>
</html>
