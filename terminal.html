<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wip: alan.yu (initial commit)</title><!-- homage: terminal.shop -->
<style>
  /* themes */
  :root, body[data-theme="dark"]{
    --bg:#0a0a0a; --fg:#dcdcdc; --dim:#6f6f6f; --accent:#ffffff; --link:#9ecbff;
  }
  body[data-theme="green"]{
    --bg:#041104; --fg:#39ff6f; --dim:#1e7a3c; --accent:#b7ffcf; --link:#8affb0;
  }
  body[data-theme="charm"]{
    --bg:#191024; --fg:#e9d5ff; --dim:#8b7aa8; --accent:#ff79c6; --link:#bd93f9;
  }
  body[data-theme="paper"]{
    --bg:#f2f0ea; --fg:#1c1c1c; --dim:#8a8a83; --accent:#000000; --link:#1a5dbb;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono",monospace;
    font-size:14px;
    line-height:1.5;
    transition:background .15s, color .15s;
  }
  #screen{
    position:fixed; inset:0;
    overflow-y:auto;
    padding:22px 20px 40vh;
    cursor:text;
  }
  .line{ white-space:pre-wrap; word-break:break-word; min-height:1.5em; }
  .dim{ color:var(--dim); }
  .acc{ color:var(--accent); }
  .cmd{ color:var(--accent); }
  a{ color:var(--link); text-decoration:underline; text-underline-offset:2px; }
  /* input line */
  #iline{ white-space:pre-wrap; word-break:break-word; }
  #icursor{
    background:var(--fg); color:var(--bg);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ background:transparent; color:inherit; } }
  #kbd{
    position:fixed; left:8px; bottom:8px;
    width:2px; height:2px; opacity:0; border:0; padding:0;
    background:transparent; color:transparent;
  }
  /* fx overlay (donut / matrix) */
  #fx{
    position:fixed; inset:0; z-index:50;
    display:none; align-items:center; justify-content:center;
    background:var(--bg);
  }
  #fx.on{ display:flex; }
  #fxcanvas{ position:absolute; inset:0; width:100%; height:100%; display:none; }
  #fxpre{
    margin:0; font-size:13px; line-height:15px;
    color:var(--fg); display:none;
  }
  #fx.mode-pre #fxpre{ display:block; }
  #fx.mode-canvas #fxcanvas{ display:block; }
  #fxhint{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center; color:var(--dim); font-size:12px;
  }
  /* crt mode */
  body.crt #screen, body.crt #fxpre{ text-shadow:0 0 6px; }
  body.crt::after{
    content:''; position:fixed; inset:0; z-index:99; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px);
  }
</style>
</head>
<body data-theme="dark">
<div id="screen">
  <div id="out"></div>
  <div id="iline"></div>
</div>
<input id="kbd" autocomplete="off" autocapitalize="off" spellcheck="false">
<div id="fx">
  <canvas id="fxcanvas"></canvas>
  <pre id="fxpre"></pre>
  <div id="fxhint">esc / click to exit</div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
 * terminal-style personal site prototype
 * nods: terminal.shop (title), LiveTerm/satnaing (command UX),
 * charm (theme), a1k0n donut, Rezmason matrix (see `matrix` output)
 * ===================================================================== */

const $ = id => document.getElementById(id);
const screenEl = $('screen'), outEl = $('out'), ilineEl = $('iline'), kbd = $('kbd');
const fxEl = $('fx'), fxPre = $('fxpre'), fxCanvas = $('fxcanvas');

const PROMPT_HTML = '<span class="dim">visitor@alan:~$</span> ';
const THEMES = ['dark', 'green', 'charm', 'paper'];
const STORE_KEY = 'alan-term';

/* ---------- output helpers ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function outHTML(html, cls) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  outEl.appendChild(d);
  while (outEl.children.length > 600) outEl.removeChild(outEl.firstChild);
  screenEl.scrollTop = screenEl.scrollHeight;
  return d;
}
const out = (text, cls) => outHTML(esc(text), cls);
const blank = () => out('');

function box(lines) {
  const w = Math.max(...lines.map(l => l.length));
  const top = '┌' + '─'.repeat(w + 2) + '┐';
  const bot = '└' + '─'.repeat(w + 2) + '┘';
  out(top, 'dim');
  lines.forEach(l => outHTML('<span class="dim">│</span> ' + esc(l.padEnd(w)) + ' <span class="dim">│</span>'));
  out(bot, 'dim');
}

/* ---------- banner (5×7 glyphs, figlet-style) ---------- */
const GLYPHS = {
  'A': ['01110','10001','10001','11111','10001','10001','10001'],
  'B': ['11110','10001','10001','11110','10001','10001','11110'],
  'C': ['01110','10001','10000','10000','10000','10001','01110'],
  'D': ['11110','10001','10001','10001','10001','10001','11110'],
  'E': ['11111','10000','10000','11110','10000','10000','11111'],
  'F': ['11111','10000','10000','11110','10000','10000','10000'],
  'G': ['01110','10001','10000','10111','10001','10001','01110'],
  'H': ['10001','10001','10001','11111','10001','10001','10001'],
  'I': ['01110','00100','00100','00100','00100','00100','01110'],
  'J': ['00111','00010','00010','00010','00010','10010','01100'],
  'K': ['10001','10010','10100','11000','10100','10010','10001'],
  'L': ['10000','10000','10000','10000','10000','10000','11111'],
  'M': ['10001','11011','10101','10101','10001','10001','10001'],
  'N': ['10001','11001','11001','10101','10011','10011','10001'],
  'O': ['01110','10001','10001','10001','10001','10001','01110'],
  'P': ['11110','10001','10001','11110','10000','10000','10000'],
  'Q': ['01110','10001','10001','10001','10101','10010','01101'],
  'R': ['11110','10001','10001','11110','10100','10010','10001'],
  'S': ['01111','10000','10000','01110','00001','00001','11110'],
  'T': ['11111','00100','00100','00100','00100','00100','00100'],
  'U': ['10001','10001','10001','10001','10001','10001','01110'],
  'V': ['10001','10001','10001','10001','10001','01010','00100'],
  'W': ['10001','10001','10001','10101','10101','10101','01010'],
  'X': ['10001','10001','01010','00100','01010','10001','10001'],
  'Y': ['10001','10001','01010','00100','00100','00100','00100'],
  'Z': ['11111','00001','00010','00100','01000','10000','11111'],
  '0': ['01110','10001','10011','10101','11001','10001','01110'],
  '1': ['00100','01100','00100','00100','00100','00100','01110'],
  '2': ['01110','10001','00001','00110','01000','10000','11111'],
  '3': ['11111','00010','00100','00010','00001','10001','01110'],
  '4': ['00010','00110','01010','10010','11111','00010','00010'],
  '5': ['11111','10000','11110','00001','00001','10001','01110'],
  '6': ['00110','01000','10000','11110','10001','10001','01110'],
  '7': ['11111','00001','00010','00100','01000','01000','01000'],
  '8': ['01110','10001','10001','01110','10001','10001','01110'],
  '9': ['01110','10001','10001','01111','00001','00010','01100'],
  '·': ['00000','00000','00000','00100','00000','00000','00000'],
  '-': ['00000','00000','00000','01110','00000','00000','00000'],
};
function printBig(word, cls) {
  for (let r = 0; r < 7; r++) {
    let line = '';
    for (const ch of word) {
      const g = GLYPHS[ch];
      if (!g) { line += '      '; continue; }
      for (let c = 0; c < 5; c++) line += g[r][c] === '1' ? '█' : ' ';
      line += ' ';
    }
    outHTML('<span class="' + (cls || 'acc') + '">' + esc(line) + '</span>');
  }
}
function printBanner() {
  printBig('ALAN·YU');
  out('v0.1 · wip: initial commit', 'dim');
}

/* ---------- fake filesystem ---------- */
const FS = {
  'resume.txt': [
    'alan yu',
    '────────',
    '3d · blender · web experiments',
    '',
    '(placeholder — put the real thing here,',
    ' or wire this to a real resume.pdf)',
  ],
  'todo.txt': [
    '[x] ascii playground (11 scenes)',
    '[x] naked-eye 3d ALAN',
    '[x] terminal prototype',
    '[ ] actual content, lol',
  ],
  '.secrets/donut.c': ['nice find. but just run `donut` :)'],
  '.secrets/matrix.txt': ['the properly-done rain: https://rezmason.github.io/matrix/'],
};

/* ---------- fx overlay: donut & matrix ---------- */
let fxRaf = 0, fxMode = null, fxT0 = 0, fxLast = 0, matrixCols = null;

function fxTick(now) {
  if (!fxMode || now - fxLast < 25) return;   // debounce: rAF + interval both drive
  fxLast = now;
  (fxMode === 'donut' ? donutFrame : matrixFrame)((now - fxT0) / 1000);
}
function fxStart(mode) {
  fxMode = mode;
  fxEl.className = 'on mode-' + (mode === 'matrix' ? 'canvas' : 'pre');
  fxT0 = performance.now(); fxLast = 0;
  if (mode === 'matrix') matrixInit();
  const loop = now => {
    if (!fxMode) return;
    fxTick(now);
    fxRaf = requestAnimationFrame(loop);
  };
  fxRaf = requestAnimationFrame(loop);
}
// fallback driver for environments that throttle rAF (embeds, hidden tabs)
setInterval(() => fxTick(performance.now()), 40);
function fxStop() {
  if (!fxMode) return;
  const was = fxMode;
  fxMode = null;
  cancelAnimationFrame(fxRaf);
  fxEl.className = '';
  out('(' + was + ' stopped)', 'dim');
  kbd.focus({ preventScroll: true });
}

// --- donut (a1k0n's math, text rendering) ---
const DRAMP = '.,-~:;=!*#$@';
function donutFrame(t) {
  const cw = 7.8, chh = 15;
  const cols = Math.max(40, Math.min(110, Math.floor(innerWidth * 0.9 / cw)));
  const rows = Math.max(20, Math.min(42, Math.floor(innerHeight * 0.82 / chh)));
  const asp = cw / chh;
  const buf = new Array(cols * rows).fill(' ');
  const zb = new Float32Array(cols * rows);
  const A = t * 0.9, B = t * 0.5;
  const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
  const R1 = 1, R2 = 2, K2 = 5;
  const scale = Math.min(cols * 0.38, rows * 0.38 / asp);
  const K1 = scale * K2 / (R1 + R2);
  const cx = cols / 2, cy = rows / 2;
  for (let th = 0; th < 6.28; th += 0.07) {
    const ct = Math.cos(th), st = Math.sin(th);
    const circX = R2 + R1 * ct, circY = R1 * st;
    for (let ph = 0; ph < 6.28; ph += 0.02) {
      const cp = Math.cos(ph), sp = Math.sin(ph);
      const x3 = circX * (cB * cp + sA * sB * sp) - circY * cA * sB;
      const y3 = circX * (sB * cp - sA * cB * sp) + circY * cA * cB;
      const ooz = 1 / (K2 + cA * circX * sp + circY * sA);
      const xp = Math.floor(cx + K1 * ooz * x3);
      const yp = Math.floor(cy + K1 * asp * ooz * y3);
      if (xp < 0 || xp >= cols || yp < 0 || yp >= rows) continue;
      const L = cp * ct * sB - cA * ct * sp - sA * st + cB * (cA * st - ct * sA * sp);
      if (L <= 0) continue;
      const i = yp * cols + xp;
      if (ooz > zb[i]) {
        zb[i] = ooz;
        buf[i] = DRAMP[Math.min(11, Math.floor(L * 8))];
      }
    }
  }
  const linesArr = [];
  for (let y = 0; y < rows; y++) linesArr.push(buf.slice(y * cols, y * cols + cols).join(''));
  fxPre.textContent = linesArr.join('\n');
}

// --- matrix rain (tribute; the definitive one is Rezmason's) ---
const MCHARS = 'ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ0123456789Z:・.=*+-<>¦';
function matrixInit() {
  const dpr = window.devicePixelRatio || 1;
  fxCanvas.width = Math.round(innerWidth * dpr);
  fxCanvas.height = Math.round(innerHeight * dpr);
  const g = fxCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#000502';
  g.fillRect(0, 0, innerWidth, innerHeight);
  const cell = 17;
  const n = Math.ceil(innerWidth / cell);
  matrixCols = [];
  for (let i = 0; i < n; i++) {
    matrixCols.push({ y: Math.random() * -60, sp: 0.35 + Math.random() * 0.75 });
  }
}
function matrixFrame() {
  // self-heal if the canvas was sized while the viewport was 0 (mid-load) or resized since
  if (fxCanvas.width !== Math.round(innerWidth * (window.devicePixelRatio || 1)) && innerWidth > 0) matrixInit();
  const g = fxCanvas.getContext('2d');
  const cell = 17;
  g.fillStyle = 'rgba(0,5,2,0.10)';
  g.fillRect(0, 0, innerWidth, innerHeight);
  g.font = '15px ui-monospace, Menlo, monospace';
  for (let i = 0; i < matrixCols.length; i++) {
    const c = matrixCols[i];
    c.y += c.sp;
    const yy = Math.floor(c.y);
    const ch = MCHARS[(Math.random() * MCHARS.length) | 0];
    g.fillStyle = '#d8ffe8';
    g.fillText(ch, i * cell, yy * cell);
    g.fillStyle = 'rgba(57,255,111,0.85)';
    g.fillText(MCHARS[(Math.random() * MCHARS.length) | 0], i * cell, (yy - 1) * cell);
    if (yy * cell > innerHeight + 80 && Math.random() > 0.975) {
      c.y = Math.random() * -30; c.sp = 0.35 + Math.random() * 0.75;
    }
  }
}

/* ---------- commands ---------- */
const CMDS = {};
function cmd(name, desc, fn, hidden) { CMDS[name] = { desc, fn, hidden: !!hidden }; }

cmd('help', 'list commands', () => {
  blank();
  Object.entries(CMDS).filter(([, c]) => !c.hidden).forEach(([n, c]) => {
    outHTML('  <span class="acc">' + n.padEnd(10) + '</span><span class="dim">· ' + esc(c.desc) + '</span>');
  });
  out('  (hidden ones exist. `ls` is a good start.)', 'dim');
  blank();
});

cmd('about', 'who is this', () => {
  blank();
  out('alan yu — 3d & web experiments');
  out('currently: building this site, one character at a time');
  outHTML('stack of the month: blender · three.js · <span class="dim">(edit me in terminal.html)</span>');
  blank();
});

cmd('projects', 'selected work', () => {
  blank();
  box([
    '01  ascii playground     11 realtime scenes',
    '    plasma·donut·flow·type + 5 ALAN 3d pieces',
    '    → run `play` (or `play 7` for a scene)',
    '',
    '02  naked-eye 3d ALAN    voxel text, window trick',
    '    off-axis parallax + z-buffer occlusion',
    '',
    '03  (next project here)  placeholder',
  ]);
  blank();
});

cmd('contact', 'say hi', () => {
  blank();
  outHTML('  mail    <a href="mailto:yualan077@gmail.com">yualan077@gmail.com</a>');
  outHTML('  github  <span class="dim">(add yours in terminal.html)</span>');
  blank();
});

cmd('theme', 'theme [' + THEMES.join('|') + ']', args => {
  const cur = document.body.dataset.theme;
  if (!args[0]) {
    outHTML('themes: ' + THEMES.map(t => t === cur ? '<span class="acc">[' + t + ']</span>' : t).join(' · '));
    return;
  }
  if (!THEMES.includes(args[0])) { out('unknown theme: ' + args[0]); return; }
  document.body.dataset.theme = args[0];
  saveStore();
  out('theme → ' + args[0], 'dim');
});

cmd('crt', 'toggle scanlines', () => {
  document.body.classList.toggle('crt');
  saveStore();
  out('crt ' + (document.body.classList.contains('crt') ? 'on' : 'off'), 'dim');
});

cmd('play', 'open the ascii playground (play [1-11])', args => {
  const n = parseInt(args[0], 10);
  const url = 'index.html' + (n >= 1 && n <= 11 ? '#s=' + n : '');
  out('launching playground… (browser back returns here)', 'dim');
  setTimeout(() => { location.href = url; }, 350);
});

cmd('donut', 'mmm, torus (esc exits)', () => fxStart('donut'));
cmd('matrix', 'digital rain (esc exits)', () => {
  outHTML('<span class="dim">tribute mode — the definitive rain is <a href="https://rezmason.github.io/matrix/" target="_blank" rel="noreferrer">rezmason/matrix</a></span>');
  fxStart('matrix');
});

cmd('banner', 'reprint the banner', () => { blank(); printBanner(); blank(); });
cmd('figlet', 'big letters: figlet <text>', args => {
  const text = args.join(' ').toUpperCase().replace(/[^A-Z0-9·\- ]/g, '').slice(0, 12);
  if (!text.trim()) { out('usage: figlet <text>   (a-z 0-9, max 12 chars)'); return; }
  blank(); printBig(text); blank();
});
cmd('clear', 'wipe screen (ctrl+l)', () => { outEl.innerHTML = ''; });
cmd('history', 'command history', () => hist.forEach((h, i) => out('  ' + String(i + 1).padStart(3) + '  ' + h, 'dim')));

/* hidden flavor */
cmd('ls', '', args => {
  const p = (args[0] || '').replace(/\/$/, '');
  if (!p) { outHTML('<span class="acc">projects/</span>  <span class="acc">.secrets/</span>  resume.txt  todo.txt'); return; }
  if (p === 'projects') { out('see `projects`', 'dim'); return; }
  if (p === '.secrets') { out('donut.c  matrix.txt'); return; }
  out('ls: no such directory: ' + p);
}, true);
cmd('cat', '', args => {
  if (!args[0]) { out('cat: which file?'); return; }
  const key = args[0].replace(/^\.\//, '');
  const hit = FS[key] || FS['.secrets/' + key];
  if (!hit) { out('cat: no such file: ' + args[0]); return; }
  blank(); hit.forEach(l => /https?:\/\//.test(l)
    ? outHTML(esc(l).replace(/(https?:\/\/\S+)/, '<a href="$1" target="_blank" rel="noreferrer">$1</a>'))
    : out(l));
  blank();
}, true);
cmd('whoami', '', () => out('visitor'), true);
cmd('date', '', () => out(new Date().toString()), true);
cmd('echo', '', args => out(args.join(' ')), true);
cmd('sudo', '', () => out('visitor is not in the sudoers file. this incident will be reported (to no one).'), true);
cmd('ssh', '', args => {
  if ((args[0] || '').includes('terminal.shop')) {
    outHTML('that magic belongs to <a href="https://www.terminal.shop/" target="_blank" rel="noreferrer">terminal.shop</a> — try the real <span class="acc">ssh terminal.shop</span> in your own terminal ☕');
  } else out('ssh: no route to host');
}, true);
cmd('starwars', '', () => {
  outHTML('pay respects to the 1997 original: <a href="https://www.asciimation.co.nz/" target="_blank" rel="noreferrer">asciimation.co.nz</a>');
}, true);
cmd('exit', '', () => out('there is no exit. (closing the tab works though)'), true);

/* ---------- exec / input ---------- */
const hist = [];
let histIdx = -1, booted = false;

function exec(raw) {
  const s = raw.trim();
  outHTML(PROMPT_HTML + '<span class="cmd">' + esc(raw) + '</span>');
  if (!s) return;
  hist.push(s); histIdx = hist.length;
  const [name, ...args] = s.split(/\s+/);
  const c = CMDS[name.toLowerCase()];
  if (c) { c.fn(args); return; }
  const low = name.toLowerCase();
  const sug = Object.keys(CMDS).find(k => !CMDS[k].hidden && k.startsWith(low.slice(0, 3)))
           || Object.keys(CMDS).find(k => !CMDS[k].hidden && k[0] === low[0]);
  out('command not found: ' + name + (sug ? '  (did you mean `' + sug + '`?)' : '  — try `help`'));
}

function renderInput() {
  const v = kbd.value, at = kbd.selectionStart ?? v.length;
  const under = at < v.length ? v[at] : ' ';
  ilineEl.innerHTML = PROMPT_HTML +
    esc(v.slice(0, at)) +
    '<span id="icursor">' + esc(under) + '</span>' +
    esc(v.slice(at + 1));
}

function complete() {
  const v = kbd.value;
  const parts = v.split(/\s+/);
  let pool, prefix;
  if (parts.length <= 1) {
    pool = Object.keys(CMDS); prefix = parts[0] || '';
  } else {
    const c = parts[0].toLowerCase(); prefix = parts[parts.length - 1];
    if (c === 'theme') pool = THEMES;
    else if (c === 'play') pool = Array.from({ length: 11 }, (_, i) => String(i + 1));
    else if (c === 'cat') pool = Object.keys(FS);
    else if (c === 'ls') pool = ['projects', '.secrets'];
    else return;
  }
  const hits = pool.filter(p => p.startsWith(prefix));
  if (!hits.length) return;
  if (hits.length === 1) {
    parts[parts.length - 1] = hits[0];
    kbd.value = parts.join(' ') + (parts.length === 1 ? ' ' : '');
    kbd.setSelectionRange(kbd.value.length, kbd.value.length);
  } else {
    out(hits.join('   '), 'dim');
  }
  renderInput();
}

kbd.addEventListener('input', renderInput);
kbd.addEventListener('keydown', e => {
  if (fxMode) { e.preventDefault(); return; }   // fx swallows typing; esc handled globally
  if (e.key === 'Enter') {
    const v = kbd.value; kbd.value = '';
    renderInput(); exec(v);
    e.preventDefault();
  } else if (e.key === 'Tab') {
    complete(); e.preventDefault();
  } else if (e.key === 'ArrowUp') {
    if (histIdx > 0) { histIdx--; kbd.value = hist[histIdx] || ''; kbd.setSelectionRange(kbd.value.length, kbd.value.length); renderInput(); }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (histIdx < hist.length) { histIdx++; kbd.value = hist[histIdx] || ''; kbd.setSelectionRange(kbd.value.length, kbd.value.length); renderInput(); }
    e.preventDefault();
  } else if (e.key === 'l' && e.ctrlKey) {
    outEl.innerHTML = ''; e.preventDefault();
  } else {
    requestAnimationFrame(renderInput);
  }
});
kbd.addEventListener('keyup', renderInput);

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && fxMode) { fxStop(); e.preventDefault(); }
});
fxEl.addEventListener('mousedown', () => fxStop());
screenEl.addEventListener('mouseup', () => {
  if (!String(getSelection())) kbd.focus({ preventScroll: true });
});

/* ---------- persistence ---------- */
function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      theme: document.body.dataset.theme,
      crt: document.body.classList.contains('crt'),
    }));
  } catch (_) {}
}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (THEMES.includes(s.theme)) document.body.dataset.theme = s.theme;
    if (s.crt) document.body.classList.add('crt');
  } catch (_) {}
}

/* ---------- boot ---------- */
const BOOT = [
  ['alan·yu terminal — bios 0.1.0', 0],
  ['memory check ............ ok', 140],
  ['mounting ~/alan ......... ok', 120],
  ['ascii engine ............ ok', 130],
  ['', 90],
];
function boot() {
  loadStore();
  renderInput();
  let delay = 120;
  const timers = [];
  BOOT.forEach(([txt, d]) => {
    delay += d;
    timers.push(setTimeout(() => out(txt, 'dim'), delay));
  });
  timers.push(setTimeout(() => {
    printBanner(); blank();
    outHTML('welcome. type <span class="acc">`help`</span> to look around — <span class="dim">tab completes, ↑ recalls</span>');
    blank();
    booted = true;
    screenEl.scrollTop = screenEl.scrollHeight;
  }, delay + 160));
  kbd.focus({ preventScroll: true });
}
boot();

/* debug hook for automated checks */
window.__term = {
  run: s => { kbd.value = ''; renderInput(); exec(s); },
  fxTick: n => { for (let i = 0; i < n; i++) { fxLast = 0; fxTick(performance.now() + i * 16); } }
};

})();
</script>
